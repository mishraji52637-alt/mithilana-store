<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mithilana Store - Admin Panel</title>
    <style>
        body { font-family: Arial, sans-serif; padding: 20px; background-color: #f4f4f9; }
        h2 { text-align: center; }
        table { width: 100%; border-collapse: collapse; margin-top: 20px; background: white; }
        th, td { border: 1px solid #ddd; padding: 10px; text-align: left; }
        th { background-color: #007bff; color: white; }
        button { padding: 8px 16px; background-color: #28a745; color: white; border: none; cursor: pointer; margin-bottom: 10px; }
    </style>
</head>
<body>

    <h2>Admin Panel - Received Orders</h2>
    <button onclick="fetchOrders()">Refresh Orders</button>

    <table id="ordersTable">
        <thead>
            <tr>
                <th>Name</th>
                <th>Item</th>
                <th>Amount (₹)</th>
            </tr>
        </thead>
        <tbody>
            <!-- Orders will be loaded here -->
        </tbody>
    </table>

    <script>
        async function fetchOrders() {
            try {
                const response = await fetch('https://mithilana-store.onrender.com/api/orders');
                const orders = await response.json();
                
                const tbody = document.querySelector('#ordersTable tbody');
                tbody.innerHTML = '';

                if (orders.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" style="text-align:center;">No orders yet.</td></tr>';
                    return;
                }

                orders.forEach(order => {
                    const row = `<tr>
                        <td>${order.name || 'N/A'}</td>
                        <td>${order.item || 'N/A'}</td>
                        <td>₹${order.amount || '0'}</td>
                    </tr>`;
                    tbody.innerHTML += row;
                });
            } catch (error) {
                console.error("Error fetching orders:", error);
            }
        }

        // Auto load orders on page open
        fetchOrders();
    </script>
</body>
</html>
