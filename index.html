<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mithilana Store</title>
    <style>
        body { font-family: Arial, sans-serif; text-align: center; padding: 20px; }
        .form-container { max-width: 400px; margin: auto; border: 1px solid #ccc; padding: 20px; border-radius: 8px; }
        input, button { width: 100%; padding: 10px; margin: 10px 0; box-sizing: border-box; }
        button { background-color: #28a745; color: white; border: none; font-size: 16px; cursor: pointer; }
    </style>
</head>
<body>

    <h2>Mithilana Store - Place Order</h2>
    <div class="form-container">
        <input type="text" id="name" placeholder="Your Name" required>
        <input type="text" id="item" placeholder="Item Name" required>
        <input type="number" id="amount" placeholder="Amount (₹)" required>
        <button onclick="placeOrder()">Place Order</button>
    </div>

    <script>
        async function placeOrder() {
            const name = document.getElementById('name').value;
            const item = document.getElementById('item').value;
            const amount = document.getElementById('amount').value;

            if (!name || !item || !amount) {
                alert("Please fill all fields!");
                return;
            }

            try {
                const response = await fetch('https://mithilana-store.onrender.com/api/orders', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ name, item, amount })
                });

                const result = await response.json();
                if (result.success) {
                    alert("Order Placed Successfully!");
                } else {
                    alert("Order Failed!");
                }
            } catch (error) {
                console.error("Error:", error);
                alert("Error placing order. Please try again.");
            }
        }
    </script>
</body>
</html>
